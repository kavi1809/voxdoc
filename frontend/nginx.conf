server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be large; the backend enforces the real limit.
    client_max_body_size 50m;

    # React Router owns the client-side routes, so any unknown path must still
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent turns can take a while when several tools run.
        proxy_read_timeout 180s;
    }
}
